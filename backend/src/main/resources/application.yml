spring:
  application:
    name: FitMaster

  datasource:
    url: jdbc:mysql://localhost:3306/fitmaster_db
    username: root
    password: 123444
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    detect-encoding: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  app:
    jwtSecret: SGVsbG9Xb3JsZFRoaXNJc0FTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb25XaXRoU3ByaW5nQm9vdA==
    jwtExpirationMs: 86400000
    jwtCookieName: springBootEcom

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB