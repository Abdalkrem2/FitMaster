spring:
  application:
    name: FitMaster

  datasource:
    url: jdbc:mysql://localhost:3306/fitmaster_db
    username: root
    password: 123444
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
