<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 20px;
        }
        .header h1 { color: #4CAF50; font-size: 24px; margin: 0; }
        .header p { color: #888; margin: 5px 0; }
        .macros {
            display: table;
            width: 100%;
            margin-bottom: 25px;
            border-collapse: collapse;
        }
        .macro-box {
            display: table-cell;
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .macro-box .value { font-size: 20px; font-weight: bold; color: #4CAF50; }
        .macro-box .label { font-size: 11px; color: #888; }
        .meal {
            margin-bottom: 25px;
            page-break-inside: avoid;
        }
        .meal-title {
            background-color: #4CAF50;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .meal-meta { font-size: 11px; color: #888; margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th { background-color: #f0f0f0; padding: 6px; text-align: left; font-size: 11px; border: 1px solid #ddd; }
        td { padding: 6px; font-size: 11px; border: 1px solid #ddd; }
        .steps-title { font-size: 12px; font-weight: bold; margin: 8px 0 4px 0; }
        .step { font-size: 11px; margin-bottom: 3px; color: #555; }
        .footer { text-align: center; margin-top: 30px; color: #888; font-size: 10px; }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <h1>FitMaster — Nutrition Plan</h1>
    <p th:text="'Goal: ' + ${plan.goal} + '  |  Daily Calories: ' + ${plan.dailyCalories} + ' kcal'"></p>
</div>

<!-- Macros Summary -->
<div class="macros">
    <div class="macro-box">
        <div class="value" th:text="${plan.dailyCalories} + ' kcal'"></div>
        <div class="label">Daily Calories</div>
    </div>
    <div class="macro-box">
        <div class="value" th:text="${plan.proteinGrams} + 'g'"></div>
        <div class="label">Protein</div>
    </div>
    <div class="macro-box">
        <div class="value" th:text="${plan.carbsGrams} + 'g'"></div>
        <div class="label">Carbs</div>
    </div>
    <div class="macro-box">
        <div class="value" th:text="${plan.fatGrams} + 'g'"></div>
        <div class="label">Fat</div>
    </div>
</div>

<!-- Meals -->
<div th:each="meal : ${plan.meals}" class="meal">
    <div class="meal-title">
        <span th:text="${meal.name}"></span>
        — <span th:text="${meal.mealTime}"></span>
        | <span th:text="${meal.totalCalories} + ' kcal'"></span>
    </div>
    <div class="meal-meta" th:text="'Prep time: ' + ${meal.prepTime}"></div>

    <!-- Foods Table -->
    <table>
        <tr>
            <th>Food</th>
            <th>Amount</th>
            <th>Calories</th>
            <th>Protein</th>
            <th>Carbs</th>
            <th>Fat</th>
        </tr>
        <tr th:each="food : ${meal.foods}">
            <td th:text="${food.name}"></td>
            <td th:text="${food.amount}"></td>
            <td th:text="${food.calories} + ' kcal'"></td>
            <td th:text="${food.proteinGrams} + 'g'"></td>
            <td th:text="${food.carbsGrams} + 'g'"></td>
            <td th:text="${food.fatGrams} + 'g'"></td>
        </tr>
    </table>

    <!-- Recipe Steps -->
    <div class="steps-title">Preparation:</div>
    <div th:each="step : ${meal.recipeSteps}" class="step">
        <span th:text="${step.stepOrder} + '. ' + ${step.instruction}"></span>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>Generated by FitMaster</p>
</div>

</body>
</html>
