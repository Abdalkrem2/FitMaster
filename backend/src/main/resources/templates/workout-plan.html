<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #6C63FF;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #6C63FF;
            font-size: 24px;
            margin: 0;
        }
        .header p {
            color: #888;
            margin: 5px 0;
        }
        .day {
            margin-bottom: 25px;
            page-break-inside: avoid;
        }
        .day-title {
            background-color: #6C63FF;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #f0f0f0;
            padding: 8px;
            text-align: left;
            font-size: 12px;
            border: 1px solid #ddd;
        }
        td {
            padding: 8px;
            font-size: 12px;
            border: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 10px;
        }
    </style>
    <title></title>
</head>
<body>

<!-- Header -->
<div class="header">
    <h1>FitMaster — Workout Plan</h1>
    <p th:text="${plan.name}"></p>
    <p th:text="'Goal: ' + ${plan.goal} + '  |  Level: ' + ${plan.level}"></p>
</div>

<!-- Days -->
<div th:each="day : ${plan.days}" class="day">
    <div class="day-title">
        Day <span th:text="${day.dayNumber}"></span>
        — <span th:text="${day.muscleGroupLabel}"></span>
    </div>

    <table>
        <tr>
            <th>#</th>
            <th>Exercise</th>
            <th>Sets</th>
            <th>Reps</th>
        </tr>
        <tr th:each="ex : ${day.exercises}">
            <td th:text="${ex.orderIndex}"></td>
            <td th:text="${ex.exerciseName}"></td>
            <td th:text="${ex.sets}"></td>
            <td th:text="${ex.reps} + ' - ' + ${ex.repsMax}"></td>
        </tr>
    </table>
</div>

<!-- Footer -->
<div class="footer">
    <p>Generated by FitMaster</p>
</div>

</body>
</html>
